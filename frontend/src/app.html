<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width" />

    <!-- Tailwind via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        daisyui: {
          themes: ["light", {
            smooth: {
              "primary": "#a3e635",
              "secondary": "#60a5fa",
              "accent": "#f472b6",
              "neutral": "#f3f4f6",
              "base-100": "#ffffff",
            },
          }]
        },
        plugins: [require(daisyui)],
      };
    </script>
    <!-- DaisyUI -->
    <script src="https://cdn.jsdelivr.net/npm/daisyui@3.7.7"></script>

    %sveltekit.head%
  </head>
  <body class="bg-base-100 text-neutral">
    %sveltekit.body%
  </body>
</html>
